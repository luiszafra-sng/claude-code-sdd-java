[project]
name = "claude-code-sdd-java-docs"
version = "0.1.0"
description = "Formación Claude Code + SDD (Speckit) para Java — sitio de documentación MkDocs Material."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Sngular" },
]

[dependency-groups]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-git-revision-date-localized-plugin==1.6.0",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==12.0.1",
]

[tool.uv]
default-groups = ["docs"]
