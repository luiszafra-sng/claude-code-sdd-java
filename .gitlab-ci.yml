image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

variables:
  DEFAULT_BRANCH: "main"
  UV_CACHE_DIR: "${CI_PROJECT_DIR}/.uv-cache"
  UV_LINK_MODE: "copy"

stages:
  - build
  - deploy

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache/
    - $HOME/.cache/uv/

build-mr:
  stage: build
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - docs/**/*
        - mkdocs.yml
        - pyproject.toml
        - uv.lock
  script:
    - uv sync --frozen
    - uv run mkdocs build --strict

pages:
  stage: deploy
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEFAULT_BRANCH'
  script:
    - uv sync --frozen
    - uv run mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  environment:
    name: pages
    url: $CI_PAGES_URL
